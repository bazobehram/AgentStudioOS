[project]
name = "agent-studio-sdk"
version = "0.1.0"
description = "AgentStudioOS Python SDK"
authors = [{name="AgentStudioOS"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

