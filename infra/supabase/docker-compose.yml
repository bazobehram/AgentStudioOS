version: "3.8"
services:
  db:
    image: supabase/postgres:15.1.0.120
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_PORT: 3000
    ports:
      - "3001:3000"
  realtime:
    image: supabase/realtime:v2.25.59
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "4000:4000"
  studio:
    image: supabase/studio:20250108-98f8b64
    depends_on:
      - db
    environment:
      STUDIO_PG_META_URL: http://postgrest:3000
      SUPABASE_URL: http://localhost:3001
    ports:
      - "54323:3000"
volumes:
  db_data:

